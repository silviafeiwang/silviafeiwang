name: Boo

# Draws Boo's card with the same rules as the desktop app
# (https://github.com/silviafeiwang/github-touchbar-pet), hourly so today's
# count and streak stay current.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: silviafeiwang/github-touchbar-pet@main
        with:
          name: Boo
          species: ghost
          timezone: America/Vancouver
          output: commit-pet.svg
